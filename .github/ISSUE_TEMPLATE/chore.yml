name: Chore Template
description: 설정, 빌드, 의존성, 환경 정리 등 기타 작업용 템플릿
title: "[Chore] "
labels:
  - chore

body:
  - type: input
    id: summary
    attributes:
      label: "📦 어떤 작업인가요?"
      description: "작업 내용을 간단히 적어주세요."
      placeholder: "ex. Unreal 프로젝트 설정 및 빌드 환경 정리"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "📌 작업 상세 내용"
      description: "구체적인 작업 내용을 작성해주세요."
      placeholder: |
        ex.
        - 프로젝트 설정 정리
        - 불필요한 에셋 및 파일 제거
        - Git ignore 및 LFS 설정 점검
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "👀 참고 사항"
      description: "관련 배경이나 참고할 내용을 작성해주세요."
      placeholder: "ex. 로컬 개발 환경 기준으로 우선 적용"
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: "✅ 완료 조건"
      description: "어떤 상태가 되면 이 이슈가 완료인지 작성해주세요."
      placeholder: |
        - [ ] 필요한 설정이 정상적으로 반영된다
        - [ ] 기존 기능에 영향을 주지 않는다
        - [ ] 프로젝트가 정상적으로 실행된다
    validations:
      required: true
