name: Test Template
description: 테스트 추가 또는 수정 시 사용하는 이슈 템플릿
title: "[Test] "
labels:
  - test

body:
  - type: input
    id: summary
    attributes:
      label: "📦 어떤 테스트를 추가/수정하나요?"
      description: "작업할 테스트를 간단히 적어주세요."
      placeholder: "ex. 추격 AI 상태 전환 테스트 추가"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "📌 작업 상세 내용"
      description: "구체적인 테스트 작업 내용을 작성해주세요."
      placeholder: |
        ex.
        - 플레이어 발견 시 Chase 전환 확인
        - 시야 상실 시 Search 전환 확인
        - 공격 거리 진입 시 Attack 전환 확인
        - 증거 감지 후 Investigate 이동 확인
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "🐻 참고 사항"
      description: "테스트 범위나 제약사항이 있으면 작성해주세요."
      placeholder: "ex. AI Perception 디버그 화면을 함께 확인"
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: "✅ 완료 조건"
      description: "테스트 작업 완료 기준을 작성해주세요."
      placeholder: |
        - [ ] 주요 시나리오 테스트가 완료된다
        - [ ] 예상한 상태 전환 결과와 실제 결과가 일치한다
        - [ ] 기존 기능에 회귀 문제가 발생하지 않는다
    validations:
      required: true
