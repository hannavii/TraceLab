name: Docs Template
description: 문서 작성 또는 수정 시 사용하는 이슈 템플릿
title: "[Docs] "
labels:
  - docs

body:
  - type: input
    id: summary
    attributes:
      label: "📦 어떤 문서를 작업하나요?"
      description: "문서 작업 내용을 간단히 적어주세요."
      placeholder: "ex. README에 TraceLab AI 시스템 설명 추가"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "📌 작업 상세 내용"
      description: "수정 또는 추가할 문서 내용을 작성해주세요."
      placeholder: |
        ex.
        - 프로젝트 소개 작성
        - AI 상태 구조 설명 추가
        - 실행 방법 및 조작법 작성
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "🐻 참고 사항"
      description: "관련 링크나 참고할 자료가 있으면 작성해주세요."
      placeholder: "ex. 기존 게임 기획 노션 내용 참고"
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: "✅ 완료 조건"
      description: "문서 작업 완료 기준을 작성해주세요."
      placeholder: |
        - [ ] 문서 내용이 현재 프로젝트 상태와 일치한다
        - [ ] 다른 사람이 읽고 프로젝트 구조를 이해할 수 있다
        - [ ] 필요한 이미지 또는 설명이 포함된다
    validations:
      required: true
