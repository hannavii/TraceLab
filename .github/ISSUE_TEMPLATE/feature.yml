name: Feature Template
description: 기능 추가 시 사용하는 이슈 템플릿
title: "[Feature] "
labels:
  - feature
body:
  - type: input
    id: summary
    attributes:
      label: "📦 어떤 기능을 추가하나요?"
      description: "추가할 기능을 한 줄로 설명해주세요."
      placeholder: "ex. AI Hearing 기반 소리 감지 기능 구현"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: "📌 작업할 내용"
      description: "구체적인 작업 내용을 작성해주세요."
      placeholder: |
        ex.
        - AI Perception Hearing Sense 추가
        - 플레이어 Noise 이벤트 구현
        - 소리 발생 위치 조사 기능 구현
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "🐻 추가 설명"
      description: "필요하면 자세한 배경이나 참고 내용을 적어주세요."
      placeholder: "ex. 세부 우선순위 계산은 별도 이슈에서 구현 예정"
    validations:
      required: false

  - type: textarea
    id: done
    attributes:
      label: "✅ 완료 조건"
      description: "어떤 상태가 되면 이 이슈가 완료인지 작성해주세요."
      placeholder: |
        - [ ] 기능이 정상적으로 동작한다
        - [ ] 주요 시나리오를 확인한다
        - [ ] 기존 기능과 충돌하지 않는다
    validations:
      required: true
